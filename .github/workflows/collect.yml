name: Collect and publish Parka propagation

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: parka-propagation-collector
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect NOAA observations
        run: python collector.py

      - name: Archive observations in GitHub
        run: |
          git config user.name 'parka-propagation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history.csv data/history.json data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive NOAA propagation observations'
            git push
          fi

      - name: Prepare published website
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -R assets _site/
          cp data/history.csv data/history.json data/latest.json _site/data/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
